<h2 mat-dialog-title>Nuevo producto</h2>
<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
<mat-dialog-content>
    <mat-form-field style="padding: 10px">
        <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
      <mat-error *ngIf="productForm.get('nombre')?.hasError('required')">
        El nombre es requerido
      </mat-error>
    </mat-form-field>
    <mat-form-field style="padding: 10px">
        <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="precio">
      <mat-error *ngIf="productForm.get('precio')?.hasError('required')">
        El precio es requerido
      </mat-error>
    </mat-form-field>
    <mat-form-field style="padding: 10px">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="descripcion">
      <mat-error *ngIf="productForm.get('descripcion')?.hasError('minlength')">
        La descripcion debe tener como minimo 4 caracteres
      </mat-error>
    </mat-form-field>
    <mat-form-field style="padding: 10px">
      <mat-label>Imagen Url</mat-label>
      <input matInput formControlName="imagenUrl">
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!productForm.valid">
      Guardar
    </button>
  </mat-dialog-actions>
</form>
